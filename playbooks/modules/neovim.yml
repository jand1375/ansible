
- name: Configure Neovim Rust environment
  hosts: all
  become: true

  tasks:
    - name: Install Neovim and Rust development tools
      ansible.builtin.apt:
        name:
          - neovim
          - rustc
          - cargo
          - rust-analyzer
          - rustfmt
        state: present
        update_cache: true

    - name: Create Neovim configuration directory
      ansible.builtin.file:
        path: /home/adminja/.config/nvim
        state: directory
        owner: adminja
        group: adminja
        mode: "0755"

    - name: Deploy Neovim configuration
      ansible.builtin.copy:
        src: ../../files/neovim/init.lua
        dest: /home/adminja/.config/nvim/init.lua
        owner: adminja
        group: adminja
        mode: "0644"